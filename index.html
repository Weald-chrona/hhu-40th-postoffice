<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>四秩砺行 · 信领新途 ｜ 信息科学与工程学院办学四十周年</title>
  <meta name="description" content="河海大学信息科学与工程学院办学四十周年主题网站：四秩砺行，信领新途。" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <!-- 邮局主页那块手绘主视觉是首屏唯一的大图，但它是由 sections/postoffice.js
       注入到 DOM 的，浏览器要等脚本跑完才发现。先把地址告诉它，早点开始取 -->
  <link rel="preload" as="image" href="images/po-head-sketch.jpg" />
  <meta name="theme-color" content="#0B2239" />
  <!-- 分享卡片：微信/群里发链接时显示的那张封面图，必须用绝对地址 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="四秩砺行 · 信领新途" />
  <meta property="og:title" content="四秩砺行 · 信领新途 ｜ 信息科学与工程学院办学四十周年" />
  <meta property="og:description" content="河海大学信息科学与工程学院办学四十周年：四秩砺行，信领新途。四十号邮局、院史时间轴、学科成果、校友风采。" />
  <meta property="og:url" content="https://weald-chrona.github.io/hhu-40th-postoffice/" />
  <meta property="og:image" content="https://weald-chrona.github.io/hhu-40th-postoffice/images/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/assets-inline.css" />
  <!-- ↓↓↓ 各板块样式，加载顺序即层叠顺序，请勿随意调整先后顺序 ↓↓↓ -->
  <link rel="stylesheet" href="css/history.css" />
  <link rel="stylesheet" href="css/achievements.css" />
  <link rel="stylesheet" href="css/postoffice.css" />
  <link rel="stylesheet" href="css/alumni.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="page-home">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <!-- ===== 导航 =====
       is-solid 直接写在标签上：删掉首页深色封面之后，导航下面是浅色板块，
       等 JS 再加这个类会闪一下透明，白底上看不清字 -->
  <header class="nav is-solid" id="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html" aria-label="返回首页">
        <span class="brand-mark">40</span>
        <span class="brand-text">
          信息科学与工程学院
          <small>四秩砺行 · 信领新途</small>
        </span>
      </a>

      <nav class="nav-links" id="navLinks" aria-label="主导航">
        <a href="#blessings" data-tab="postoffice">四十号邮局</a>
        <a href="about.html">学院概况</a>
        <a href="#history" data-tab="history">院史时间轴</a>
        <a href="#achievements" data-tab="achievements">学科成果</a>
        <a href="#alumni" data-tab="alumni">校友风采</a>
      </nav>

      <button class="nav-toggle" id="navToggle" aria-label="展开菜单"
              aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- ===== 板块切换区：同一时刻只显示一个 data-panel =====
         外层 .panel 是切换开关，内层 #sec-xxx 才是 sections/*.js 注入内容的位置，
         所以 sections 里的文件不需要任何改动。 -->
    <div class="panel" data-panel="history">
      <!-- ===== 一、院史时间轴（内容来自 sections/history.js） ===== -->
      <div id="sec-history"></div>
    </div>

    <div class="panel" data-panel="achievements">
      <!-- ===== 二、学科成果（内容来自 sections/achievements.js） ===== -->
      <div id="sec-achievements"></div>
    </div>

    <div class="panel" data-panel="alumni">
      <!-- ===== 三、校友风采（内容来自 sections/alumni.js） ===== -->
      <div id="sec-alumni"></div>
    </div>

    <div class="panel" data-panel="postoffice">
      <!-- ===== 四、四十号邮局（内容来自 sections/postoffice.js） ===== -->
      <div id="sec-postoffice"></div>
    </div>
  </main>

  <!-- ===== 页脚 ===== -->
  <footer class="footer">
    <div class="container footer-grid">
      <div class="footer-brand">
        <span class="brand-mark">40</span>
        <div>
          <strong>信息科学与工程学院</strong>
          <p>四秩砺行 · 信领新途</p>
        </div>
      </div>

      <nav class="footer-links" aria-label="页脚导航">
        <a href="#blessings" data-tab="postoffice">四十号邮局</a>
        <a href="about.html">学院概况</a>
        <a href="#history" data-tab="history">院史时间轴</a>
        <a href="#achievements" data-tab="achievements">学科成果</a>
        <a href="#alumni" data-tab="alumni">校友风采</a>
      </nav>

      <div class="footer-meta">
        <p>江苏南京 · 河海大学江宁校区</p>
        <p>第十二届网页设计大赛参赛作品</p>
      </div>
    </div>
    <div class="container footer-bottom">
      <p>© <span id="year">2025</span> 河海大学信息科学与工程学院 · <span class="no-break">本页面为参赛演示作品</span></p>
    </div>
  </footer>

  <button class="to-top" id="toTop" aria-label="回到顶部">↑</button>

  <!-- ↓↓↓ 板块内容注入，必须在 main.js 之前加载 ↓↓↓ -->
  <script src="sections/history.js"></script>
  <script src="sections/achievements.js"></script>
  <script src="sections/alumni.js"></script>
  <script src="sections/postoffice.js"></script>

  <!-- ↓↓↓ 四十号邮局 ↓↓↓ -->
  <!-- 以前从 jsdelivr 取。国内那个源时不时上不来，一旦取不到，
       js/letters.js 会以为「没配后端」而静默退到本地演示模式 —— 页面看着正常，
       其实投的信只存在这台机器上。所以改成放进仓库、跟站点一起发。 -->
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sensitiveWords.js"></script>
  <script src="js/letters.js"></script>

  <script src="js/main.js"></script>
</body>
</html>
